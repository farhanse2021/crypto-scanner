name: scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: trades
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hour stamp (for CoinGecko cache key)
        id: hour
        run: echo "h=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      - name: Restore CoinGecko cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: meta-${{ steps.hour.outputs.h }}
          restore-keys: meta-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Commit trade log
        if: always()
        run: |
          if [[ -n "$(git status --porcelain data/trades.json)" ]]; then
            git config user.name "scanner-bot"
            git config user.email "scanner-bot@users.noreply.github.com"
            git add data/trades.json
            git commit -m "trades update"
            git pull --rebase -q
            git push
          fi
